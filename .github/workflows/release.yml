name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: CLI smoke test
        run: |
          ./dist/macpurge --help
          ./dist/macpurge --version

      - name: Stage artifact
        run: |
          mkdir -p release
          cp dist/macpurge release/macpurge-darwin-arm64
          chmod +x release/macpurge-darwin-arm64
          (cd release && shasum -a 256 macpurge-darwin-arm64 > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macpurge-darwin-arm64
            release/SHA256SUMS.txt
          generate_release_notes: true
