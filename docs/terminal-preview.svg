<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">macpurge terminal interface</title>
  <desc id="description">A dark terminal window displaying a colorful macpurge application scan with confirmed, review, and protected results.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#10162a"/>
      <stop offset="1" stop-color="#1d1230"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#070b14"/>
  <circle cx="1010" cy="90" r="240" fill="#7c3aed" opacity="0.12"/>
  <circle cx="175" cy="655" r="260" fill="#06b6d4" opacity="0.09"/>
  <g filter="url(#shadow)">
    <rect x="60" y="45" width="1080" height="630" rx="22" fill="url(#background)" stroke="#334155" stroke-width="2"/>
    <path d="M60 106H1140" stroke="#334155" stroke-width="2"/>
    <circle cx="96" cy="76" r="8" fill="#fb7185"/>
    <circle cx="124" cy="76" r="8" fill="#facc15"/>
    <circle cx="152" cy="76" r="8" fill="#4ade80"/>
    <text x="600" y="83" text-anchor="middle" fill="#64748b" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">macpurge scan “Visual Studio Code”</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="94" y="135" width="1012" height="92" rx="12" fill="#0b1220" stroke="url(#brand)" stroke-width="2"/>
    <text x="122" y="173" font-size="25" font-weight="700" fill="#22d3ee">◆ MAC<tspan fill="#c084fc">PURGE</tspan></text>
    <text x="1068" y="173" text-anchor="end" font-size="18" fill="#64748b">v0.2.0</text>
    <text x="122" y="204" font-size="17" fill="#94a3b8">Inspect deeply. Remove deliberately.</text>
    <text x="94" y="270" font-size="21" font-weight="700" fill="#22d3ee">◆</text>
    <text x="124" y="270" font-size="21" font-weight="700" fill="#f8fafc">Visual Studio Code</text>
    <text x="352" y="270" font-size="16" fill="#64748b">v1.103.2 · com.microsoft.VSCode · Standalone</text>
    <text x="94" y="320" font-size="19" font-weight="700" fill="#22d3ee">◆</text>
    <text x="124" y="320" font-size="19" font-weight="700" fill="#f8fafc">Ready to quarantine</text>
    <text x="354" y="320" font-size="15" fill="#64748b">8 items · 1.3 GB · Strong ownership evidence</text>
    <circle cx="105" cy="354" r="6" fill="#4ade80"/>
    <text x="126" y="360" font-size="17" fill="#94a3b8">970 MB</text>
    <text x="230" y="360" font-size="17" fill="#e2e8f0">/Applications/Visual Studio Code.app</text>
    <text x="126" y="384" font-size="13" font-weight="700" fill="#4ade80">CONFIRMED</text>
    <text x="230" y="384" font-size="13" fill="#64748b">application · exact bundle identity</text>
    <circle cx="105" cy="416" r="6" fill="#4ade80"/>
    <text x="126" y="422" font-size="17" fill="#94a3b8">296 MB</text>
    <text x="230" y="422" font-size="17" fill="#e2e8f0">~/Library/Application Support/Code</text>
    <text x="126" y="446" font-size="13" font-weight="700" fill="#4ade80">CONFIRMED</text>
    <text x="230" y="446" font-size="13" fill="#64748b">application-support · built-in VS Code profile</text>
    <text x="94" y="494" font-size="19" font-weight="700" fill="#facc15">◆</text>
    <text x="124" y="494" font-size="19" font-weight="700" fill="#f8fafc">Needs your review</text>
    <text x="326" y="494" font-size="15" fill="#64748b">2 items · never selected automatically</text>
    <path d="M99 526l6-6 6 6-6 6z" fill="#facc15"/>
    <text x="126" y="532" font-size="17" fill="#94a3b8">12 KB</text>
    <text x="230" y="532" font-size="17" fill="#e2e8f0">…/AnotherApp/Backups/Code</text>
    <path d="M94 570H1106" stroke="#334155" stroke-width="2"/>
    <circle cx="105" cy="610" r="6" fill="#4ade80"/>
    <text x="126" y="616" font-size="17" font-weight="700" fill="#f8fafc">8</text>
    <text x="146" y="616" font-size="17" fill="#4ade80">confirmed</text>
    <text x="258" y="616" font-size="16" fill="#64748b">(1.3 GB)</text>
    <circle cx="387" cy="610" r="6" fill="#facc15"/>
    <text x="408" y="616" font-size="17" font-weight="700" fill="#f8fafc">2</text>
    <text x="428" y="616" font-size="17" fill="#facc15">review</text>
    <circle cx="550" cy="610" r="6" fill="#64748b"/>
    <text x="571" y="616" font-size="17" font-weight="700" fill="#f8fafc">3</text>
    <text x="591" y="616" font-size="17" fill="#94a3b8">protected</text>
    <text x="1068" y="616" text-anchor="end" font-size="15" fill="#c084fc">quarantine first ↗</text>
  </g>
</svg>
